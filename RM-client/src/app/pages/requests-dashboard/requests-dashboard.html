<div class="dashboard-container">
  <h2>ניהול פניות (Requests Dashboard)</h2>

  <app-aggregations-panel
    [totalCount]="totalCount()"
    [statusCounts]="statusCounts()"
    [priorityCounts]="priorityCounts()"
  />

  <app-request-filters-bar (filtersChange)="onFiltersChange($event)" />

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="loading-state">
    טוען נתונים...
  </div>

  <!-- Error State -->
  <div *ngIf="errorMessage()" class="error-state">
    {{ errorMessage() }}
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading() && !errorMessage() && requests().length === 0" class="empty-state">
    לא נמצאו פניות תואמות.
  </div>

  <ng-container *ngIf="!isLoading() && requests().length > 0">
    <app-requests-table
      [requests]="requests()"
      (openHistory)="onOpenHistory($event)"
      (refreshNeeded)="onRefreshNeeded()"
    />

    <app-pagination
      [page]="page()"
      [hasNextPage]="hasNextPage()"
      (pageChange)="changePage($event)"
    />
  </ng-container>

  <app-audit-history-modal
    *ngIf="selectedAuditRequestId() !== null"
    [requestId]="selectedAuditRequestId()!"
    (close)="onCloseHistory()"
  />
</div>
